fill="#4e6558">Persist answer or failure</text><path d="M70 850H1530" stroke="#aab9a7"/><text x="70" y="888" font-size="20" fill="#4e6558">Public guide: sandeshbagmare.github.io/astrology-evidence/ | Public source: github.com/sandeshbagmare/astrology-evidence</text><text x="70" y="920" font-size="20" fill="#4e6558">AI and embeddings are disabled by default; no real books ingested. Live provider and production gates remain open.</text><text x="70" y="952" font-size="20" fill="#4e6558">Pages is a static guide, not the Python application. Citations do not establish predictive accuracy. Public docs, 17 Nov 2026.</text></g></svg>